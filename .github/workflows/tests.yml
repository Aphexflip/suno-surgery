name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python CLI tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI package
        run: python -m pip install -e ./cli
      - name: Run unit tests
        run: python -m unittest discover -s cli/tests -v
      - name: Check command entry point
        run: python -m suno_patch_kit --help

  extension:
    name: Browser extension logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate extension manifest
        run: python3 -m json.tool extension/manifest.json > /dev/null
      - name: Run prompt builder tests
        run: node --test extension/tests/prompt.test.mjs

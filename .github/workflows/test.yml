name: Suno Surgery tests

on:
  push:
    branches: [main, fix/**]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python CLI tests
        run: |
          python -m pip install -e ./cli
          python -m unittest discover -s cli/tests -v
      - name: Extension JavaScript tests
        run: node --test extension/tests/prompt.test.mjs
      - name: Manifest is valid and toolbar is wired for side panel
        run: |
          python -c "import json; m=json.load(open('extension/manifest.json')); assert m['manifest_version']==3; assert 'default_popup' not in m['action']; assert m['side_panel']['default_path']=='sidepanel.html'"
